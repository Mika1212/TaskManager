services:
  user-service:
    build: ./user-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "${USER_SERVICE_PORT}:8081"
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod

  task-service:
    build: ./task-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "${TASK_SERVICE_PORT}:8082"
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod

  project-service:
    build: ./project-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "${PROJECT_SERVICE_PORT}:8083"
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
